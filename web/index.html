<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f1f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KnowledgeTree</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="dunkel">
<script>/* Design vor dem ersten Bild (1.30): kein heller Blitz beim Start im dunklen Design */try{if(localStorage.getItem('kt-theme')==='hell')document.body.dataset.theme='hell';}catch(e){}</script>
<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <span class="app-logo" title="KnowledgeTree"></span>
      <button class="qat" id="qat-save" title="Speichern (Strg+S)"></button>
      <span class="qat-split">
        <button class="qat" id="qat-undo" title="Rückgängig (Strg+Z)"></button><button class="qat drop" id="qat-undo-list" title="Verlauf anzeigen"></button>
      </span>
      <button class="qat" id="qat-redo" title="Wiederholen (Strg+Y)"></button>
      <span class="qat-sep"></span>
      <button class="qat" id="qat-back" title="Zurück (Alt+←)"></button>
      <button class="qat" id="qat-fwd" title="Vor (Alt+→)"></button>
      <button class="qat" id="qat-recent" title="Zuletzt verwendete Seiten"></button>
      <span class="qat-sep"></span>
      <button class="qat" id="qat-calc" title="Taschenrechner (Alt+R)"></button>
    </div>
    <div class="tb-title" id="tb-title">KnowledgeTree</div>
    <div class="tb-right">
      <label class="tb-search"><span id="tb-search-ic"></span><input id="tb-search" placeholder="Suchen (Strg+F)" autocomplete="off"></label>
    </div>
  </header>

  <nav id="ribbon">
    <div id="tabs"></div>
    <div id="panel"></div>
  </nav>

  <div id="warnbar" hidden></div>

  <main id="main">
    <aside id="nav-groups" class="navcol">
      <div class="nav-head"><span>Notizbücher</span><span class="nav-tools"><button class="nav-add" id="add-group" title="Neu: Abschnitt, Abschnittsgruppe oder Notizbuch"></button><button class="nav-add nav-fold" data-fold="groups" title="Notizbücher einklappen"></button></span></div>
      <div id="group-tree" class="navlist"></div>
      <div id="nav-groups-foot" class="nav-foot" title="Neuer Abschnitt oder neue Abschnittsgruppe im aktuellen Notizbuch"></div>
      <div class="nav-strip" data-fold="groups" title="Notizbücher ausklappen"><span class="nav-strip-ic"></span><span class="nav-strip-label">Notizbücher</span></div>
    </aside>
    <div class="splitter" data-for="groups"></div>

    <section id="stage">
      <div id="section-tabs"></div>
      <div id="panes"><!-- Tabs und geteilte Bereiche (panes.js) – die Zeichenfläche hängt im aktiven Bereich -->
      <div id="page-frame">
        <div id="version-bar" hidden></div>
        <div id="page-head">
          <input id="page-title" placeholder="Seitentitel" autocomplete="off" spellcheck="false">
          <div id="page-meta" title="Klicken, um Datum und Uhrzeit zu ändern"></div>
        </div>
        <div id="xl-bar" hidden>
          <input id="xl-name" spellcheck="false" autocomplete="off" title="Zelle oder Bereich (z.B. B5 oder A1:C4 eingeben und Enter)">
          <button id="xl-cancel" type="button" title="Abbrechen (Esc)">✕</button><button id="xl-ok" type="button" title="Übernehmen (Enter)">✓</button><button id="xl-fx" type="button" title="Funktion einfügen">fx</button>
          <textarea id="xl-input" rows="1" spellcheck="false" placeholder="Wert oder Formel (beginnt mit =)"></textarea>
        </div>
        <div id="viewport" tabindex="-1">
          <div id="world">
            <svg id="draw-defs" width="0" height="0" aria-hidden="true">
              <defs>
                <linearGradient id="kt-rainbow" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff2d55"/><stop offset=".18" stop-color="#ff9500"/><stop offset=".36" stop-color="#ffcc00"/>
                  <stop offset=".54" stop-color="#34c759"/><stop offset=".72" stop-color="#0a84ff"/><stop offset=".88" stop-color="#5e5ce6"/><stop offset="1" stop-color="#bf5af2"/>
                </linearGradient>
                <linearGradient id="kt-gold" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8a6d1d"/><stop offset=".35" stop-color="#f5d76e"/><stop offset=".55" stop-color="#c9a227"/><stop offset=".8" stop-color="#fff2b0"/><stop offset="1" stop-color="#9c7a1e"/>
                </linearGradient>
                <pattern id="kt-glitter" width="7" height="7" patternUnits="userSpaceOnUse">
                  <circle cx="1.5" cy="1.5" r=".9" fill="#fff"/><circle cx="5" cy="4.5" r=".6" fill="#fff" opacity=".8"/><circle cx="3" cy="6.1" r=".45" fill="#fffbe0"/>
                </pattern>
                <filter id="kt-pencil" x="-20%" y="-20%" width="140%" height="140%">
                  <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" result="n"/>
                  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
                </filter>
              </defs>
            </svg>
            <div id="layer-bg"></div>
            <div id="layer-pkgs"></div>
            <div id="layer-pics"></div>
            <svg id="layer-draw-under" class="draw-layer" xmlns="http://www.w3.org/2000/svg"><g></g></svg>
            <svg id="layer-links" xmlns="http://www.w3.org/2000/svg"><g id="links-g"></g></svg>
            <div id="layer-boxes"></div>
            <svg id="layer-draw-mark" class="draw-layer" xmlns="http://www.w3.org/2000/svg"><g></g></svg>
            <svg id="layer-draw-over" class="draw-layer" xmlns="http://www.w3.org/2000/svg"><g></g></svg>
            <div id="layer-front"></div>
            <div id="layer-tools"></div>
            <svg id="layer-handles" xmlns="http://www.w3.org/2000/svg"></svg>
            <svg id="layer-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div id="marquee" hidden></div>
          <svg id="anchors" aria-hidden="true"></svg>
          <div id="hscroll" class="kt-scroll h" hidden><div class="kt-thumb"></div></div>
          <div id="vscroll" class="kt-scroll v" hidden><div class="kt-thumb"></div></div>
          <button id="scroll-corner" type="button" hidden title="Zum Anfang der Seite (Strg+Pos1) · Doppelklick = alles anzeigen"></button>
          <div id="empty-state" hidden></div>
          <div id="preview-glass" hidden></div>
          <button id="fs-exit" class="btn" hidden>Vollbild beenden (F11)</button>
        </div>
      </div>
      </div>
    </section>

    <div class="splitter" data-for="pages"></div>
    <aside id="nav-pages" class="navcol">
      <div class="nav-head"><span id="pages-head">Seiten</span><span class="nav-tools"><button class="nav-add" id="sort-pages" title="Seiten sortieren"></button><button class="nav-add" id="add-page" title="Neue Seite (Alt+N)"></button><button class="nav-add nav-fold" data-fold="pages" title="Seitenliste einklappen"></button></span></div>
      <div id="page-list" class="navlist"></div>
      <div class="nav-strip" data-fold="pages" title="Seitenliste ausklappen"><span class="nav-strip-ic"></span><span class="nav-strip-label" id="pages-strip-label">Seiten</span></div>
    </aside>
  </main>

  <footer id="statusbar">
    <div id="sb-left"></div>
    <div id="sb-hint"></div>
    <div id="sb-right">
      <span id="sb-save"></span>
      <span id="sb-views"></span>
      <button class="sb-btn" id="sb-zoom-out" title="Verkleinern">−</button>
      <input type="range" id="sb-zoom" min="0" max="1000" value="667">
      <button class="sb-btn" id="sb-zoom-in" title="Vergrössern">+</button>
      <button class="sb-btn wide" id="sb-zoom-val" title="Auf 100 % zurücksetzen">100 %</button>
    </div>
  </footer>
</div>

<div id="toast"></div>

<script src="js/util.js"></script>
<script src="js/contrast.js"></script>
<script src="js/sheet-calc.js"></script>
<script src="js/icons.js"></script>
<script src="js/backend-server.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/layout.js"></script>
<script src="js/route.js"></script>
<script src="js/imgpack.js"></script>
<script src="js/ooxml.js"></script>
<script src="js/office.js"></script>
<script src="js/office-ppt.js"></script>
<script src="js/office-doc.js"></script>
<script src="js/office-objects.js"></script>
<script src="js/office-wordimport.js"></script>
<script src="js/office-reader.js"></script>
<script src="js/office-xl.js"></script>
<script src="js/office-anim.js"></script>
<script src="js/office-show.js"></script>
<script src="js/office-view.js"></script>
<script src="js/office-word.js"></script>
<script src="js/office-grid.js"></script>
<script src="js/office-slides.js"></script>
<script src="js/office-convert.js"></script>
<script src="js/office-saveas.js"></script>
<script src="js/office-io.js"></script>
<script src="js/office-xltools.js"></script>
<script src="js/office-wordtools.js"></script>
<script src="js/office-ppttools.js"></script>
<script src="js/office-ui.js"></script>
<script src="js/canvas.js"></script>
<script src="js/draw.js"></script>
<script src="js/sheet.js"></script>
<script src="js/chart.js"></script>
<script src="js/calc.js"></script>
<script src="js/mathink.js"></script>
<script src="js/mathsteps.js"></script>
<script src="js/mathcas.js"></script>
<script src="js/fotomath.js"></script>
<script src="js/filepages.js"></script>
<script src="js/ktfile.js"></script>
<script src="js/guide.js"></script>
<script src="js/commands.js"></script>
<script src="js/formula.js"></script>
<script src="js/chem.js"></script>
<script src="js/chem-layout.js"></script>

<script src="js/export.js"></script>
<script src="js/print.js"></script>
<script src="js/onenote.js"></script>

<script src="js/onenote-write.js"></script>
<script src="js/settings.js"></script>
<script src="js/ribbon.js"></script>
<script src="js/backstage.js"></script>
<script src="js/panes.js"></script>
<script src="js/spell-engine.js"></script>
<script src="js/spell-fach.js"></script>
<script src="js/spell.js"></script>
<script src="js/grammar.js"></script>
<script src="js/fonts.js"></script>

<script src="js/tellme.js"></script>
<script src="js/main.js"></script>
</body>
</html>
